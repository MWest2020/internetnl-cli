# Wat iemand nodig heeft om dit over te nemen. Gelezen door estafette
# (MWest2020/estafette); `estafette assess .` toetst het.
name: internetnl-cli
licence: MIT
owner: Mark West
contact: https://github.com/MWest2020/internetnl-cli/issues
