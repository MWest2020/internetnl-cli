name: 'internetnl-cli scan'
description: >-
  Submit hosts to an internet.nl-compatible batch API (the hosted instance,
  a self-hosted one, or the netnl facade) and gate CI on scored subtest
  failures.
author: 'MWest2020'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  hosts:
    description: >-
      Space-separated hostnames to test. Provide exactly one of `hosts` or
      `file`.
    required: false
  file:
    description: >-
      Path to a file with one hostname per line. Provide exactly one of
      `hosts` or `file`.
    required: false
  type:
    description: 'Test type: web or mail.'
    required: false
    default: 'web'
  fail-on-scored:
    description: >-
      Exit non-zero (exit code 3) when a scored subtest failed. Set to
      "false" to only report, never gate.
    required: false
    default: 'true'
  name:
    description: 'Free-form label for the request.'
    required: false
  allowlist:
    description: >-
      Path (workspace-relative) to an allowlist file of accepted
      failures, one `host testname` pair per line (`#` comments
      allowed). Maps to `--allowlist`. Requires `actions/checkout` to
      have run first so the file exists in the workspace.
    required: false
  endpoint:
    description: 'Batch API v2 base URL (INTERNETNL_ENDPOINT).'
    required: true
  credential:
    description: >-
      Preferred way to pass the batch API credential: a single
      'username:password' string (INTERNETNL_CREDENTIAL), split on the
      first colon so a password containing one still works. Pass this
      from a single repository or organisation secret — never hardcode
      it in the workflow file. Provide either `credential`, or both
      `username` and `password`, never a mix of the two.
    required: false
  username:
    description: >-
      Batch API username (INTERNETNL_USERNAME). Alternative to
      `credential`; must be paired with `password`.
    required: false
  password:
    description: >-
      Batch API password (INTERNETNL_PASSWORD). Alternative to
      `credential`; must be paired with `username`. Pass this from a
      repository or organisation secret — never hardcode it in the
      workflow file.
    required: false

outputs:
  results-path:
    description: 'Path to the JSON results file written by this run.'
    value: ${{ steps.run.outputs.results-path }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        HOSTS_INPUT: ${{ inputs.hosts }}
        FILE_INPUT: ${{ inputs.file }}
        FAIL_ON_SCORED_INPUT: ${{ inputs.fail-on-scored }}
        CREDENTIAL_INPUT: ${{ inputs.credential }}
        USERNAME_INPUT: ${{ inputs.username }}
        PASSWORD_INPUT: ${{ inputs.password }}
      run: |
        set -eu
        if [ -n "$HOSTS_INPUT" ] && [ -n "$FILE_INPUT" ]; then
          echo "::error::internetnl-cli action: set exactly one of 'hosts' or 'file' inputs, not both." >&2
          exit 1
        fi
        if [ -z "$HOSTS_INPUT" ] && [ -z "$FILE_INPUT" ]; then
          echo "::error::internetnl-cli action: set one of 'hosts' or 'file' inputs." >&2
          exit 1
        fi
        case "$FAIL_ON_SCORED_INPUT" in
          true|false)
            ;;
          *)
            echo "::error::fail-on-scored must be 'true' or 'false'" >&2
            exit 1
            ;;
        esac
        # Exactly one credential form: the single 'credential' input, or
        # both 'username' and 'password' (never a mix of the two, never
        # neither).
        if [ -n "$CREDENTIAL_INPUT" ] && { [ -n "$USERNAME_INPUT" ] || [ -n "$PASSWORD_INPUT" ]; }; then
          echo "::error::internetnl-cli action: set either 'credential', or both 'username' and 'password' — not both forms." >&2
          exit 1
        fi
        if [ -z "$CREDENTIAL_INPUT" ] && { [ -z "$USERNAME_INPUT" ] || [ -z "$PASSWORD_INPUT" ]; }; then
          echo "::error::internetnl-cli action: set 'credential', or both 'username' and 'password'." >&2
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # This action never checks anything out (no actions/checkout step
        # runs here), so there is no lockfile/project directory to look
        # for; without this, setup-uv warns on every run. Caching is
        # similarly pointless here: nothing this step installs is reused
        # across runs of a one-shot `uv tool install`, and the measured
        # cache footprint is ~1MB — not worth the warning or the cache
        # I/O.
        ignore-empty-workdir: true
        enable-cache: false

    - name: Install internetnl-cli from this action's own ref
      shell: bash
      env:
        # github.action_repository / github.action_ref are only populated
        # when the action is consumed from another repo via `uses:
        # owner/repo@ref`; fall back to this repo's default branch so a
        # local `uses: ./` (e.g. dogfooding this action from its own repo)
        # still resolves to something installable.
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -eu
        repo="${ACTION_REPOSITORY:-MWest2020/internetnl-cli}"
        ref="${ACTION_REF:-main}"
        uv tool install "git+https://github.com/${repo}@${ref}"
        uv tool dir --bin >> "$GITHUB_PATH"

    - name: Run internetnl submit
      id: run
      shell: bash
      env:
        INTERNETNL_ENDPOINT: ${{ inputs.endpoint }}
        CREDENTIAL_INPUT: ${{ inputs.credential }}
        USERNAME_INPUT: ${{ inputs.username }}
        PASSWORD_INPUT: ${{ inputs.password }}
        HOSTS_INPUT: ${{ inputs.hosts }}
        FILE_INPUT: ${{ inputs.file }}
        TYPE_INPUT: ${{ inputs.type }}
        NAME_INPUT: ${{ inputs.name }}
        FAIL_ON_SCORED_INPUT: ${{ inputs.fail-on-scored }}
        ALLOWLIST_INPUT: ${{ inputs.allowlist }}
      run: |
        set -eu
        # Exactly one of the two credential forms reaches the CLI's own
        # environment: a composite action's `env:` mapping always sets a
        # variable (to '' when the input is unset), so mapping both
        # INTERNETNL_CREDENTIAL and INTERNETNL_USERNAME/INTERNETNL_PASSWORD
        # unconditionally would make config.py see an empty-but-present
        # INTERNETNL_CREDENTIAL even in username/password mode, tripping
        # its own format check. The "Validate inputs" step already proved
        # exactly one form was given, so branching here is safe.
        if [ -n "$CREDENTIAL_INPUT" ]; then
          export INTERNETNL_CREDENTIAL="$CREDENTIAL_INPUT"
        else
          export INTERNETNL_USERNAME="$USERNAME_INPUT"
          export INTERNETNL_PASSWORD="$PASSWORD_INPUT"
        fi
        results_path="${RUNNER_TEMP}/internetnl-results.json"
        echo "results-path=${results_path}" >> "$GITHUB_OUTPUT"

        args=(submit --type "$TYPE_INPUT" --json)
        # fail-on-scored is validated (must be 'true' or 'false') by the
        # earlier "Validate inputs" step.
        if [ "$FAIL_ON_SCORED_INPUT" = "true" ]; then
          args+=(--fail-on-scored)
        fi
        if [ -n "$NAME_INPUT" ]; then
          args+=(--name "$NAME_INPUT")
        fi
        if [ -n "$ALLOWLIST_INPUT" ]; then
          args+=(--allowlist "$ALLOWLIST_INPUT")
        fi

        if [ -n "$FILE_INPUT" ]; then
          args+=(--file "$FILE_INPUT")
        else
          # `--` marks the end of options: without it, a host that starts
          # with `-` (e.g. a stray `--no-poll` typo in the hosts input)
          # would be parsed by argparse as a flag instead of a positional
          # hostname. It must go right before the positional hosts, not
          # before `--file` above (which is itself an option, not a
          # positional).
          args+=(--)
          # HOSTS_INPUT is intentionally word-split: it is a space-separated
          # list of hostnames, not a single argument. `set -f` disables
          # glob expansion for the split so a hostname containing `*` or
          # `?` is not silently expanded against the filesystem.
          set -f
          # shellcheck disable=SC2206
          hosts_array=($HOSTS_INPUT)
          set +f
          args+=("${hosts_array[@]}")
        fi

        # internetnl's own exit code (0/1/2/3/4 — see docs/how-to/ci.md)
        # becomes this step's exit code, and therefore the job's, since it
        # is the last command in the script and `set -e` is active.
        internetnl "${args[@]}" > "$results_path"
