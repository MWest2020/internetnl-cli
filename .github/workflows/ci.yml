name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: sh scripts/verify.sh

      - name: HOME-isolation check
        run: |
          SCRATCH="$(mktemp -d)"
          HOME="$SCRATCH" ./.venv/bin/pytest -q
          test -z "$(find "$SCRATCH" -mindepth 1)" || { echo "suite wrote into HOME"; find "$SCRATCH" -mindepth 1; exit 1; }
