name: image

# Builds and pushes the facade image (`deploy/Dockerfile`, context =
# repo root) to GHCR — see openspec/changes/add-measurement-api/design.md,
# "Facade image and liveness (for the K8s topology)": the homelab manifests
# pin a specific `sha-<short>` tag; `latest` is only meaningful on `main`.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mwest2020/internetnl-cli

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Compute tags
        id: vars
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          tags="${IMAGE}:sha-${sha_short}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
