[project]
name = "internetnl-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
internetnl = "internetnl_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internetnl_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
